version: '3.9'
services:
  web:
    build: .
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    environment:
      - DATABASE_URL=sqlite:///./ak_traders.db
      - JWT_SECRET_KEY=change-this-to-a-long-random-secret
      - CORS_ORIGINS=http://localhost:8000
